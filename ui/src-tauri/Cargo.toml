[package]
name = "codex_proxy_ui"
version = "1.0.11"
description = "ProcWeaver Pro Management Console (Tauri 2.0)"
authors = ["Time Silent"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "codex_proxy_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
winreg = "0.52"
dirs-next = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
